# Local development database(s).
#
# `docker compose up` starts PostgreSQL on 5432 with a named volume and a
# health check. `postgres-test` is an isolated instance for CI/test runs.
#
# Start just the main DB:
#   docker compose up -d postgres
# Start everything:
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumora
    ports:
      - '5432:5432'
    volumes:
      - lumora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lumora']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-test:
    image: postgres:16-alpine
    container_name: lumora-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumora_test
    ports:
      - '5433:5432'
    volumes:
      - lumora_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lumora_test']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  lumora_pgdata:
  lumora_test_pgdata:
